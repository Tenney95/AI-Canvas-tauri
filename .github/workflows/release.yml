name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.3 - 视频复刻与画布素材交互'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.3 新增视频复刻插件的后台全片任务与统一素材引用，并统一播放器和剪辑时间轴。画布提示词栏支持自定义发送快捷键、清除模型选择，修复 Win10 图片复制和资产引用列表不完整的问题。

            ## 🎬 视频复刻与媒体编辑

            - 视频复刻插件支持按切点拆分全片，逐段提取参考素材、生成并裁切合成；关闭插件界面后后台任务继续运行，可查看进度和结果。
            - 插件可引用当前或上游节点、项目人物/场景/道具、全局角色及资源库图片，并通过共享的 @ 素材菜单选择参考。
            - 统一画布播放器和剪辑时间轴，优化播放进度、音量、倍速、切点与分段操作；修复导演台预演视频导出。
            - 插件市场支持从仓库子目录安装插件，并收录视频复刻插件。

            ## 🖼 画布与素材引用

            - 节点提示词的发送快捷键可在设置中选择 Enter、Shift+Enter、Ctrl+Enter 或 Alt+Enter，并显示对应换行提示。
            - 模型选择入口与同栏工具按钮统一样式，可通过 × 清除当前选择；清除后生成前需重新选择模型。
            - @ 素材菜单显示完整分类列表，按需加载缩略图并避让视口边缘；音频、视频及文本引用显示对应图标。
            - 提示词引用胶囊支持拖动调整位置，按住 Ctrl 或 Alt 拖动可复制；支持插入文字之间、跨行移动与 Escape 取消。
            - Win10 WebView 无法复制图片时，自动改用系统文件剪贴板；粘贴形式取决于目标应用对文件粘贴的支持。
            - 优化连线素材扇形预览和提示词栏渐变反馈，减少分组封面重复扫描。
            - 小地图与底部工具栏右侧对齐，缩小上下间距，窄窗口保持相同布局。

            ## 📝 编辑与窗口操作

            - 修复 Markdown 节点自动保存及本地文件改名后的同步。
            - 优化嵌套弹窗、全屏预览的焦点和键盘操作，避免弹窗快捷键触发底层画布。
            - 外观预设支持键盘选择、改名与管理；全屏预览和工具栏动画响应系统的减少动态效果设置。

            ## ⚠️ 升级与兼容性

            - IndexedDB schema 保持 v22，沿用已有项目、配置与凭据存储。
            - 视频复刻需要安装对应用户插件并准备其 Python 依赖、模型或服务环境；宿主不会自动安装 ReShot。可信 Python 插件具有当前用户权限，安装、启用或切换版本需原生确认。
            - 全片任务不会在应用重启后自动续跑；提交状态不确定时不会自动重投。视频生成仍使用已配置的 API 模型或 ComfyUI 工作流，实际调用可能产生厂商费用。
            - 新增模型需自行启用并配置对应厂商 Key。RunningHub、AutoDL、Blender 与 ComfyUI 功能仍需对应运行环境；真实生成、完整成片和跨平台安装待各自环境验收。
            - AI 应用首版仍不支持写入其他画布节点或编排模型和文件操作。已有插件必须具备有效源码与 revision 摘要及完整原生私有快照，缺失时需要重新安装。
            - Windows 不支持 AVX/AVX2 的旧款 CPU 请使用 Legacy 安装包；Legacy 不包含本地 ONNX 和自动更新。本地语音转文本依赖桌面 ONNX，Intel Mac 同样不包含此功能。
            - 视频剪辑导出编码取决于本机编解码器。原生窗口、应用内 ComfyUI、MCP 控制桥、本地文件导出与方舟 SQLite 用量账本仅在桌面版可用；浏览器模式的 API Key 仅在当前会话有效。
            - macOS 安装包使用临时签名，未经过 Apple 公证；首次打开若被拦截，可在「系统设置 → 隐私与安全性」允许，更多处理方式见[首次打开说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
