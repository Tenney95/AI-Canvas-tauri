name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.23 - 工作流参数与画布响应'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.23 将本地 ComfyUI 与 RunningHub 的常用参数统一到节点浮层，并标记提示词用途；同时减少画布、历史和长对话更新中的重复处理，完善批量任务的提交边界。

            ## 🎛️ 本地与云端工作流

            - 本地 ComfyUI 可按目标服务器的真实声明调整步数、CFG、种子、调度器等标量参数，与 RunningHub 复用比例选项、滑块和下拉控件；常用项优先显示，字段旁用 C# 标明原工作流节点编号。
            - 输入徽章根据工作流连线标记正面、负面、正负共用或未判定。RunningHub 云工作流支持 ★ 默认输入与 @ 指定输入，读取定义保留仍然有效的绑定，删除工作流后清理残留编辑状态。
            - 默认提示词和参考素材继续取自节点输入框；已绑定默认正文不再重复出现在参数浮层。保护语音子字段、负面与共用提示词，避免普通参数或旧兜底逻辑误覆盖。
            - 本次参数覆盖在上传前校验真实类型、枚举及范围，支持恢复默认和清除失效项；取消生成不会中断参数面板共用的声明读取。

            ## 🖼️ 画布交互与批量生成

            - 分组与多选批量生成复用单节点执行逻辑，每项开始前重新核对项目、节点及输入；已修改、删除或正在生成的项跳过，不提交旧参数。混合队列合计最多同时执行 3 个节点任务。
            - 统一文本、Markdown 与媒体的导入处理；异步读取或复制期间切换项目、删除节点后，不将迟到结果写回错误目标。
            - 提示词与参数浮层在点击外部时收起，并减少无关节点更新、逐帧操作和历史快照的重复处理，保留原有撤销与结果历史语义。

            ## 📚 素材与对话

            - 资产搜索和索引按批处理，集中保存共享素材库，减少重复读取及相互覆盖；项目切换与启动页缩略图继续沿用项目隔离。
            - 长对话 Markdown 按区块复用渲染，独立窗口同步减少重复内容传输，并保留最后一次编辑的交接。

            ## ⚠️ 升级与兼容性

            - 数据库沿用 v27，项目包沿用 v3；本版不新增数据迁移。团队使用兼容版本，升级前备份重要项目与应用数据，不通过降级程序回退数据库。
            - 本地工作流内部 batch_size 等批量参数大于 1 时，当前生成与恢复仍只取首份匹配产物，其余需在 ComfyUI 中查看；完整多产物回填尚未实现。画布的多节点批量生成是另一种入口。
            - 未支持的自定义节点或缺少连线时，提示词用途保留为未判定；旧 RunningHub 记录需重新读取完整定义才能补充标记。超过 JavaScript 安全整数范围的种子覆盖会拒绝，避免精度损失。
            - 项目云同步仍为手动资产同步，不共享全局资产、不自动监听或传播删除；HTTP Endpoint 仅用于可信网络。模型调用、真实 ComfyUI 工作流和各平台安装升级仍需桌面验收。
            - Windows 旧款无 AVX／AVX2 CPU 请使用 Legacy 包；Legacy 不包含本地 ONNX 和自动更新。
            - macOS 仅提供 Apple Silicon 包，采用临时签名、未经 Apple 公证；首次打开方式见[安装说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
