name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.18 - 可信 Python 插件运行时'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.18 支持可信 Python 插件运行时，允许插件调用本地 Python 执行更复杂的节点逻辑；重构批量图片生成节点生命周期，新增视频输入声明式校验，修复画布交互浮动对话框未及时隐藏的问题，并优化 MacOS 更新后重启逻辑。

            ## 🐍 可信 Python 插件运行时

            - 支持可信 Python 插件运行时，插件可调用本地 Python 执行自定义节点逻辑。
            - 完善插件 Manifest 与运行时，插件设置页支持 Python 插件配置。
            - 新增 `process:allow-restart` 权限以支持插件子进程管理。

            ## 🖼️ 批量图片生成节点重构

            - 重写批量图片生成节点生命周期，创建、运行与清理更可靠。
            - 新增批量图片生成节点测试，覆盖生命周期各阶段。

            ## 🎬 视频输入声明式校验

            - 新增视频输入声明式校验，在提交前统一校验参数与素材。
            - 新增校验规则文档与测试用例。

            ## 🐛 修复与优化

            - 修复画布交互时浮动对话框未及时隐藏的问题。
            - 优化 MacOS 更新后重启逻辑，更新更顺畅。

            ## ⚠️ 升级与兼容性

            - Python 插件运行时需要本地已安装 Python 并在设置中标记为可信。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
