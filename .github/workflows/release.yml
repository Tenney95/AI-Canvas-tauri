name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.9.5 - 分镜表制作链路与 RunningHub 接入'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.9.5 打通分镜表到成片的制作链路：支持对白字幕推送、按镜头装配配音到时间轴、宫格真实裁片绑定指定镜头，并打通剧本分镜与助手 MCP 制作流程；接入 RunningHub 云工作流、AI 应用与 AutoDL 工作流；ComfyUI 支持助手多服务器选择与工作流绑定；剧集新增章节浏览与原著章节索引。同时优化插件详情展示并完善操作说明书。

            ## 🎬 分镜表制作链路

            - 支持对白字幕推送与实时素材校验，字幕与画面同步更新。
            - 将就绪配音按镜头装配到时间轴，配音与画面对齐。
            - 宫格支持真实裁片绑定指定镜头，裁切结果可直接用于成片。
            - 接入配音视频与导演台制作节点，制作流程更连贯。
            - 增加剧本改动复核与选镜调整入口，改稿后能快速对齐。
            - 增加整表诊断与单镜优化助手入口，批量问题一次定位。
            - 打通剧本分镜与助手 MCP 制作流程。

            ## ☁️ RunningHub 与 AutoDL

            - 接入 RunningHub 云工作流与 AI 应用，并支持任务恢复。
            - 扩展 RunningHub 模型列表。
            - 接入 AutoDL 工作流，并完善工作流配置导入反馈与说明。

            ## 🧩 ComfyUI 与插件

            - ComfyUI 支持助手多服务器选择与工作流绑定。
            - 修复工作流打开空白的问题，完善编辑与保存反馈。
            - 插件详情支持折叠，右键工具收进二级菜单，界面更清爽。
            - 插件可获取宿主语言并同步界面切换。
            - 支持本地线稿资源与按当前画面生成节点。

            ## 📖 剧集与角色

            - 剧集支持章节浏览与助手引用入口。
            - 增加原著章节索引与版本约束读取。
            - 完善角色动作素材引用与画布节点显隐。

            ## 🎨 其他优化

            - APIMart 显示账户余额，并替换 Gemini Omni 视频模型。
            - 扩展 Blender 稳定版本兼容并细化运行错误提示。
            - 修复生成中遮罩浮层在节点已有内容时不显示的问题。
            - 完善操作说明书并无损压缩截图。
            - 新增逐帧拉片插件开源开发示例。

            ## ⚠️ 升级与兼容性

            - 升级后已有插件会在首次加载时补全源码摘要，无需重新安装。
            - 私有注册表目录（`plugin-private`）被用户手动删除时，已有插件会停用并要求重新安装；这是预期的失败关闭行为，不会从浏览器存储静默恢复。
            - RunningHub 与 AutoDL 工作流需要配置对应的服务地址与凭据。
            - Blender 原生运行时需要本机已安装 Blender，且需授权项目目录。
            - Windows 旧款 CPU（不支持 AVX/AVX2）请使用名称含 `Legacy` 的安装包；该版本不包含本地 ONNX 功能。
            - 本地语音转文本依赖桌面端 ONNX 运行时；Intel Mac 和 Windows Legacy 安装包不包含该功能。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`；该版本不包含本地 ONNX 功能。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }
