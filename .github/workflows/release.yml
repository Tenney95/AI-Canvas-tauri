name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.27 - ComfyUI 保存与任务保护'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.27 改善 ComfyUI 工作流编辑保存、任务取消和结果恢复，减少重复副本、丢失任务和媒体误回填。本版同时包含此前未公开 v0.10.26 的项目往返、媒体下载和连接修复。

            ## 🧩 ComfyUI 编辑与窗口

            - 普通保存更新原工作流，另存才创建副本；已删除的记录不会被旧编辑窗口重新创建，重复工作流 ID 会明确拒绝。
            - 保存超时后保留原请求，再次点击先核对同一次保存，减少回执迟到造成的重复副本；过长名称和正文在交接前提示修正。
            - 修复 API 载入被拒绝后仍可能绑定旧画布的问题，保留同名标签、切换标签和迟到回执的身份保护。
            - 参数面板与 RefMod 目录兼容两种官方下拉选项格式；原有选项类型、文件名和路径校验继续保留。
            - 优化提示词栏编辑按钮与底部工具对齐，恢复 ComfyUI 顶部空白处拖动窗口，菜单换行后拖拽范围同步调整；按钮、图标和标签仍正常点击。

            ## 🎞️ ComfyUI 任务与媒体结果

            - 提交与停止交错时先保留已收到的任务 ID；提交结果不确定时保留核对入口并阻止重复生成，不将本地停止误报为远端已终止。
            - 取消排队任务后再次核对队列；旧版服务不再使用可能误停其他任务的全局中断，无法安全取消时仅停止本地等待。
            - 启动时确认配置端口上的服务确实为 ComfyUI；其他程序占用或服务身份无法确认时明确提示，不盲目复用或结束未知进程。
            - 音频生成与恢复不再把封面或波形图作为音频回填；旧记录中的图片缓存也重新检查，缺少有效输出时保留原任务。
            - 修复部分工作流输出类型误认、空文件名及相对子目录导致的取件失败，保留正式输出优先与原服务地址。
            - 已确认的结果保留原文件信息；继续保存优先取回该文件，在文件仍存在时不再依赖 ComfyUI 历史记录。重试不会再次提交生成。
            - 保存失败显示目录授权、磁盘、网络或 HTTP 等有限原因，恢复入口合并展示；大媒体下载延长无进展等待时间，持续传输不受整文件短超时限制。

            ## 📦 项目导入与保存

            - 修复首次导入素材目录创建、跨设备路径与导入身份映射问题，改善项目归档导入后的素材关联。
            - 修复导入项目重开后无法继续保存的问题；损坏包、真实缺失素材及不安全归档路径仍明确拦截。

            ## 🔌 厂商连接与对话

            - 新增 Amam（AIGC SI）图片与视频连接，包含 Muse 等已适配渠道；填写对应 Key 后核对可用模型，不自动启用未知型号。
            - 补齐万象视频渠道参数，支持已适配厂商的余额或积分查询；查询异常不显示为零余额，账户与 Key 额度按各厂商口径展示。
            - 改善 MCP 断连、取消、完整结果交付和连接保存；外部会话失效可重新握手发现工具，已发出的工具执行不会自动重投。客户端配置继续按敏感区域脱敏。
            - 修复独立对话窗口切换项目后仍沿用旧会话的问题。

            ## ⚠️ 升级与兼容性

            - 数据库沿用 v27，项目包沿用 v3，本版不新增数据迁移。升级前备份重要项目与应用数据，不通过安装旧程序回退数据库。
            - 旧版 ComfyUI 不支持安全定向取消时，画布只停止本地等待；运行中的任务需到 ComfyUI 页面终止，随后核对原任务或继续查询。
            - 保存结果去重限当前客户端主窗口会话最近 64 次请求，不承诺跨应用重启恢复。升级后请重开 ComfyUI 编辑窗口；已有重复副本不会自动删除。
            - ComfyUI 新的直接续取依赖本版记录过的有效文件信息；旧恢复任务仍需原服务历史。输出文件已删除、过期或不再可访问时不能凭空恢复。自定义节点需返回可下载文件，不保证所有插件格式均受支持。
            - 本地工作流内部批量大于 1 时仍只接收首份匹配产物，其余请在 ComfyUI 查看。仅通过 WebSocket 出图的工作流需添加文件保存或预览节点，暂不接收其二进制图像。
            - 真实 GPU 生成、旧版与认证服务、跨设备项目往返及各平台安装升级仍需桌面验收；端口接口识别不等于进程归属证明。项目云同步继续为手动资产同步，HTTP Endpoint 仅用于可信网络。
            - Windows 旧款无 AVX／AVX2 CPU 请使用 Legacy 包；Legacy 不包含本地 ONNX 和自动更新。
            - macOS 仅提供 Apple Silicon 包，采用临时签名、未经 Apple 公证；首次打开方式见[安装说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
