name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.9.1 - 原生插件信任注册表与剧本工作台'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.9.1 建立原生插件信任注册表，插件身份与入口源码快照改由 Rust 持有，运行阶段不再接受前端提交的源码；导演台新增操作台与圆角镜头预览，支持保存 Blender 编辑结果并内置可再分发白模，运行时支持选择本地安装包离线安装；新增剧本工作台与字段级 AI 润色；同时大幅收敛媒体预览与编辑器内存占用，并优化超大画布节点投影性能。

            ## 🔐 原生插件信任注册表

            - 插件身份、活动版本、启停状态与工具归属改由 Rust 持有，入口源码快照存放在应用私有目录。
            - 执行接口只接受插件 ID 与源码摘要，不再接受完整源码，运行阶段无法替换代码。
            - 安装与更新采用暂存 → 持久化 → 激活的原子切换，保留上一批准版本可回切。
            - 停用、卸载与版本切换会阻止新调用并取消进行中的 Python 调用，失败时自动关闭而非回退。
            - 旧安装记录首次加载自动补全摘要；注册缺失或摘要不匹配时自动停用插件。

            ## 🎬 导演台与 Blender 运行时

            - 新增导演操作台与圆角镜头预览，镜头状态更直观。
            - 支持保存 Blender 编辑结果并把当前镜头回传到画布。
            - 内置可再分发的男女白模，开箱即可搭建场景。
            - 支持选择本地导演台安装包，可直接使用已下载的 `tar.gz` 离线安装，无需重新下载。
            - 本地安装与下载安装共用同一套摘要校验，并补充包大小上限与取消信号的失败关闭处理。
            - 内置导演台运行时升级到 v0.3.2。
            - 持久化手动选择的 Blender 安装路径，优化编辑器环境继承。
            - 修复自动发现、资源校验与中文界面相关问题。
            - 完善节点创建与项目回收逻辑，修正内置人物控制与资源版本冲突。

            ## 📝 剧本工作台

            - 新增剧本工作台，集中管理剧集结构与字段。
            - 支持字段级 AI 润色，可针对单个字段改写而不影响其余内容。

            ## 🤖 智能体能力

            - 兼容智能体包 Skill 与 MCP 只读调用。
            - 优化无清单智能体的兼容载入。
            - 智能体托管目录跟随用户存储根目录。

            ## ⚡ 性能优化

            - 优化超大画布节点数据投影，大场景操作更流畅。
            - 全面收敛媒体预览与编辑器内存占用。
            - 优化全屏预览内存占用。

            ## 🎭 吉祥物与体验

            - 重构吉祥物表情系统，新增动画片段播放器。
            - 加载动画替换为彩带环绕效果，等待过程更轻快。
            - 睡眠等片段锁定视线，避免眼神漂移。
            - 图片加载失败自动重试。
            - 侧边栏悬浮显示默认值改为关闭。
            - 拆分服务商连接弹窗，设置页更易维护。

            ## 🐛 修复

            - 默认启动时不再打开调试台。
            - 修正镜头预览标题垂直居中。
            - 优化编辑器背景层级与节点占位。
            - 禁止通用 Agent 直接创建或运行分镜表节点。

            ## ⚠️ 升级与兼容性

            - 升级后已有插件会在首次加载时补全源码摘要，无需重新安装。
            - 私有注册表目录（`plugin-private`）被用户手动删除时，已有插件会停用并要求重新安装；这是预期的失败关闭行为，不会从浏览器存储静默恢复。
            - Blender 原生运行时需要本机已安装 Blender，且需授权项目目录。
            - Windows 旧款 CPU（不支持 AVX/AVX2）请使用名称含 `Legacy` 的安装包；该版本不包含本地 ONNX 功能。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`；该版本不包含本地 ONNX 功能。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }
