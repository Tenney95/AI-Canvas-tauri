name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.9.2 - 插件自定义界面宿主与统一选择控件'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.9.2 新增插件自定义界面宿主，插件可以在独立窗口中提供自己的操作界面，该窗口只获得与主窗口通信所需的最小权限；插件工具支持模型字段与宿主操作循环，必填参数改为弹窗填写；统一下拉选择控件并新增 UI 组件样式指南窗口；同时新增 CCC API 内置供应商、持久化本地项目媒体引用，并修复全屏视频在严格模式下进度归零的问题。

            ## 🧩 插件自定义界面宿主

            - 新增插件界面宿主，插件可在独立窗口中提供自定义操作界面。
            - 宿主窗口只授予与主窗口通信所需的事件能力与关闭窗口权限，不提供文件系统、Shell、网络命令或新建窗口能力。
            - 插件界面与主窗口通过桥接层通信，插件无法越权访问宿主资源。

            ## 🔧 插件工具增强

            - 节点工具支持模型字段，插件可声明并使用自己的模型选择。
            - 支持宿主操作循环，插件可连续调用宿主能力完成多步任务。
            - 必填参数工具改为弹窗执行，填写更清晰。

            ## 🎨 界面与组件

            - 新增统一 Select 组件替换原生下拉框，支持固定定位菜单，弹层不再被容器裁剪。
            - 新增 UI 组件样式指南窗口，集中预览设计系统组件。
            - 调整系列栏按钮文本颜色，提高可读性。
            - 音频节点默认宽度调整为 280。

            ## 🔌 服务商与项目

            - 新增 CCC API 内置供应商分组，并更新其内置模型目录。
            - 持久化本地项目媒体引用，重新打开项目后媒体引用不再丢失。
            - 更新 Dreamina 服务商链接。

            ## 🐛 修复与优化

            - 修复全屏视频在严格模式下进度归零的问题。
            - 图片复制改为异步读取并增强错误处理。
            - 统一替换原生确认框为应用内异步对话框。
            - 优化批量执行与历史记录的稳定性。

            ## ⚠️ 升级与兼容性

            - 插件界面宿主窗口使用独立的最小权限配置，已有插件无需改动即可继续使用原有能力。
            - 升级后已有插件会在首次加载时补全源码摘要，无需重新安装。
            - 私有注册表目录（`plugin-private`）被用户手动删除时，已有插件会停用并要求重新安装；这是预期的失败关闭行为，不会从浏览器存储静默恢复。
            - Blender 原生运行时需要本机已安装 Blender，且需授权项目目录。
            - Windows 旧款 CPU（不支持 AVX/AVX2）请使用名称含 `Legacy` 的安装包；该版本不包含本地 ONNX 功能。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`；该版本不包含本地 ONNX 功能。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }
