name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.8.15 - 安全加固与节点预览增强'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.8.15 强化安全防护（修复 Markdown NUL 转义绕过并给生产窗口加上 CSP），为节点预览新增长按全屏与悬浮放大效果、生成中流光边框与思考球动效，完善角色动作素材库，重构分镜宫格编辑，并将内置样式图从 PNG 替换为 WebP 以优化体积与加载。

            ## 🛡️ 安全加固

            - 修复 renderMarkdown 的 NUL 转义绕过漏洞。
            - 为生产窗口新增内容安全策略（CSP），降低注入风险。

            ## 🖼️ 节点预览增强

            - 节点预览新增长按全屏与悬浮放大效果，快速查看大图。
            - 生成中节点对话框新增流光边框（border-beam）与 thinking-orbs 思考球动效。
            - 性能模式下自动隐藏加载动画。

            ## 🎭 角色动作素材库

            - 完善角色动作素材库，动作素材管理更完整。
            - 角色库面板与资产对话框功能大幅增强。

            ## 📐 分镜宫格重构

            - 宫格分割线可重新调整，格子改用背景贴图渲染。
            - 修复存坏的资产记录，保住宫格格子引用的文件。

            ## ⚡ 性能与修复

            - 内置样式图从 PNG 替换为 WebP，体积与加载大幅优化。
            - 自动保存失败不再静音，退出前先拦截提醒。
            - 优化节点连线方向与拖拽命中，修复操作记录浮层按钮无法点击。
            - 画布吸附尺寸以实测 DOM 为准，修正分组节点吸附尺寸与隐藏节点候选。

            ## ⚠️ 升级与兼容性

            - 安全加固与节点预览增强需要 v0.8.15 或更高版本。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
