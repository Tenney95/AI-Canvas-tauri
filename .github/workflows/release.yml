name: Release
run-name: ${{ github.event_name == 'push' && format('调度 {0}', github.ref_name) || format('发布 {0}', inputs.tag) }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送的正式版本标签（vX.Y.Z）
        required: true
        type: string

permissions:
  contents: read

# tag 入口与实际发布共用标签锁；排队，不中断已经开始的安装包上传。
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch tagged release on default branch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch fixed release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable vX.Y.Z release tag' >&2
            exit 1
          fi
          gh workflow run release.yml --repo "$GH_REPO" --ref "$DEFAULT_BRANCH" --field "tag=$RELEASE_TAG"

  quality:
    name: Quality gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      release_name: ${{ steps.target.outputs.release_name }}
      release_body: ${{ steps.target.outputs.release_body }}
      artifact_run_id: ${{ steps.proof.outputs.artifact_run_id }}
      artifact_id: ${{ steps.proof.outputs.artifact_id }}
    steps:
      # 默认分支保存跨版本缓存；目标源码仍固定到标签的不可变 SHA。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve immutable release source and notes
        id: target
        run: node scripts/release-workflow.mjs resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Wait for exact source CI and verified frontend
        id: proof
        run: node scripts/release-workflow.mjs wait-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.quality.outputs.tag }}
      RELEASE_SHA: ${{ needs.quality.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache native release dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.target }}-standard
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Install npm dependencies
        run: npm ci
      - name: Download exact verified frontend
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.quality.outputs.artifact_id }}
          run-id: ${{ needs.quality.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify frontend file hashes and source
        run: node scripts/release-workflow.mjs verify-frontend
      - name: Guard release tag and draft
        run: node scripts/release-workflow.mjs assert-publishable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ needs.quality.outputs.tag }}
          releaseCommitish: ${{ needs.quality.outputs.sha }}
          releaseName: ${{ needs.quality.outputs.release_name }}
          releaseBody: ${{ needs.quality.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config scripts/tauri-release.config.json
      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Build Windows x64 legacy
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
      RELEASE_TAG: ${{ needs.quality.outputs.tag }}
      RELEASE_SHA: ${{ needs.quality.outputs.sha }}
      RELEASE_VERSION: ${{ needs.quality.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache isolated Legacy dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: release-x86_64-pc-windows-msvc-legacy
      - name: Install npm dependencies
        run: npm ci
      - name: Download exact verified frontend
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.quality.outputs.artifact_id }}
          run-id: ${{ needs.quality.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify frontend file hashes and source
        run: node scripts/release-workflow.mjs verify-frontend
      - name: Build Windows x64 legacy
        shell: pwsh
        run: |
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config scripts/tauri-release-legacy.config.json `
            -- `
            --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'Legacy build failed' }
      - name: Collect only this version's Legacy installers
        shell: pwsh
        run: |
          $bundleRoot = Resolve-Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'legacy-installers'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $artifacts = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File | Where-Object {
            $_.Extension -in '.exe', '.msi' -and $_.Name.Contains('Legacy') -and $_.Name.Contains("_$($env:RELEASE_VERSION)_")
          })
          if ($artifacts.Count -eq 0) { throw 'No installers for this Legacy version were generated' }
          foreach ($artifact in $artifacts) { Copy-Item -LiteralPath $artifact.FullName -Destination $artifactDirectory }
      - name: Keep Legacy installers until every standard platform passes
        uses: actions/upload-artifact@v7
        with:
          name: windows-legacy-${{ needs.quality.outputs.sha }}
          path: ${{ runner.temp }}/legacy-installers/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  finalize-release:
    name: Publish verified release
    needs: [quality, publish, publish-windows-legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.quality.outputs.tag }}
      RELEASE_SHA: ${{ needs.quality.outputs.sha }}
      REQUIRE_DRAFT: 'true'
      LEGACY_ARTIFACT_DIRECTORY: ${{ runner.temp }}/legacy-installers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified Legacy installers
        uses: actions/download-artifact@v8
        with:
          name: windows-legacy-${{ needs.quality.outputs.sha }}
          path: ${{ runner.temp }}/legacy-installers
      - name: Upload Legacy and make release public after every platform passes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-workflow.mjs assert-publishable
          shopt -s nullglob
          artifacts=("$LEGACY_ARTIFACT_DIRECTORY"/*.exe "$LEGACY_ARTIFACT_DIRECTORY"/*.msi)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo 'No verified Legacy installers were downloaded' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" "${artifacts[@]}" --clobber
          node scripts/release-workflow.mjs assert-publishable
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
