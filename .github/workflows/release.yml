name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.9.6 - 历史面板固定与工作流配置统一'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.9.6 输出历史面板支持固定驻留，并新增节点聚焦脉冲提示；图片全屏预览支持按编号切换；macOS 上可自动发现 Blender 并通过应用启动；通用工作流支持统一配置，修复素材上传与模板添加；APIMart 接入 GPT Image 2.5 双版本图像模型。同时统一媒体地址识别，修复本地素材上传与保存问题。

            ## 📜 输出历史与画布

            - 输出历史面板支持固定驻留，不再随交互自动收起。
            - 新增节点聚焦脉冲，快速定位目标节点。
            - 图片全屏预览支持按编号切换，多图浏览更顺手。
            - 优化音频节点浅色主题配色。

            ## 🎬 导演台

            - macOS 支持自动发现 Blender 安装并通过应用方式启动。

            ## 🔧 工作流与服务商

            - 通用工作流支持统一配置，修复素材上传与模板添加。
            - RunningHub 优化连接卡片，并支持按来源筛选工作流。
            - APIMart 接入 GPT Image 2.5 双版本图像模型。

            ## 🐛 修复

            - 统一媒体地址识别，修复本地素材上传与保存。
            - 修复工作流等蒙层的窗口圆角裁切问题。

            ## ⚠️ 升级与兼容性

            - 升级后已有插件会在首次加载时补全源码摘要，无需重新安装。
            - 私有注册表目录（`plugin-private`）被用户手动删除时，已有插件会停用并要求重新安装；这是预期的失败关闭行为，不会从浏览器存储静默恢复。
            - RunningHub 与 AutoDL 工作流需要配置对应的服务地址与凭据。
            - Blender 原生运行时需要本机已安装 Blender，且需授权项目目录。
            - Windows 旧款 CPU（不支持 AVX/AVX2）请使用名称含 `Legacy` 的安装包；该版本不包含本地 ONNX 功能。
            - 本地语音转文本依赖桌面端 ONNX 运行时；Intel Mac 和 Windows Legacy 安装包不包含该功能。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`；该版本不包含本地 ONNX 功能。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }
