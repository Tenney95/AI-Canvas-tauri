name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.29 - 剧本协作与原文写作'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.29 将剧本工作台的智能协作、故事关系图和原文写作接在一起：按需求调用已授权的智能体与 Skill，在普通文本框创作原文，并把原文和分集剧本保存为项目内 TXT。对话助手、插件开发和画布交互同步更新。

            ## 📝 剧本工作台与稿件文件

            - 工作台支持独立窗口，查看同剧集其他分集时无需切换画布；关闭或收回窗口继续保留编辑草稿。
            - 大纲、原文、剧本、创作要点、角色、道具和关系图各自显示对应的右侧工具；组合包、智能调度、团队成员、模型和预算统一在顶部「Agent协作」设置。
            - 原文使用普通文本框，支持章节导航、字数目标和专注写作；未添加原著也可直接起稿，并使用 AI 起笔、续写或润色，预览候选后再采用。
            - 保存原文和分集剧本时，在项目的 manuscripts 文件夹生成 UTF-8 TXT；原文默认为「原文.txt」，剧本按实际分集名称命名，重名不覆盖其他文件。
            - 旧原著和未生成 TXT 的分集在下次显式保存时转存；分集改名后另存新文件并保留旧稿。外部修改已绑定文件时提示冲突，保存失败保留草稿。

            ## 🕸️ 故事关系与证据追踪

            - 新增「故事关系图」，维护人物、关键事件、伏笔及其联系，支持关系图、时间线和列表，并可切换卡片与点阵显示。
            - 支持按分集和类型筛选、全屏查看、关联正式资产以及查看原文证据；来源变化时提示重新核对。
            - 从用户选择的原文或剧本按需提取候选，先预览、映射和选择，再加入图谱；查看证据不切换画布。

            ## 🤝 智能调度与多模型协作

            - 助手和工作台可根据需求选用已授权的 Skill、智能体包入口和只读子智能体；简单请求直接完成，调用和草案可在助手查看。
            - 支持多模型团队的角色分工、依赖交接、独立审阅、成果比较和预算控制；团队成果应用到稿件前保留版本与编辑冲突检查。
            - 新增可复用的创作组合配置，绑定会话或工作台分集；改善任务保存、结果回读、上下文压缩与资料分支，未知写入结果先核对回执，避免直接重投。
            - 设置中新增可选的本机 Codex App Server 执行器，可登记受信程序并作为团队成员返回候选成果，不接管现有 Codex 会话。

            ## 🧩 插件开发与交互

            - 插件设置新增运行状态诊断和开发界面预览，可查看公开宿主合同与依赖情况；预览使用模拟数据，不安装插件或执行真实工具。
            - 插件可声明依赖，必需依赖缺失、版本不足或存在循环时阻止执行；更新、停用和卸载继续撤销旧版本调用与资源。
            - 优化聊天滚动与流式内容复用、资产面板、媒体预览、画布交互和独立窗口数据同步，修正浅色磨砂弹窗及系统主题下的窗口控件配色。

            ## ⚠️ 升级与兼容性

            - 数据库沿用 v27，项目包沿用 v3，本版不新增数据库迁移。升级前备份重要项目与应用数据，不通过安装旧程序回退数据库。
            - 原文写作仅接受不超过 2 MiB 的 UTF-8 文本。稿件 TXT 在显式保存时写入，旧文件保留；暂不监听外部文件变更来自动更新应用正文。
            - 智能调度和团队仍受当前模式、授权与预算约束，调用文本模型可能计费；子智能体保持只读。原文 AI 候选需采用并保存后才写入文件。
            - 外部执行器当前仅支持 Codex 0.167.0，需用户自行准备受信程序和单独的 OpenAI API 凭据；材料会发送到 OpenAI API 并可能计费，不复用 ChatGPT 订阅额度。本机程序登记不构成系统沙箱。
            - Windows 旧款无 AVX／AVX2 CPU 请使用 Legacy 包；Legacy 不包含本地 ONNX 和自动更新。
            - macOS 仅提供 Apple Silicon 包，采用临时签名、未经 Apple 公证；首次打开方式见[安装说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
