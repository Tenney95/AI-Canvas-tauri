name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.8 - ComfyUI 管理与节点工具'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.8 新增 ComfyUI 模型去重与运行控制台，统一图片、视频和文本节点的快捷指令管理，并完善引用搜索、主题图片与下载进度。

            ## 🧩 ComfyUI 管理与模型空间

            - 按文件内容查找重复模型，支持模型目录、插件目录、指定文件夹与整盘范围；相同内容、不同文件名也可分组。
            - 停止服务并确认后，可将选中的重复副本替换为硬链接或软链接，保留原路径与文件名；支持批量操作、中断恢复及最近操作历史。
            - 管理页新增运行控制台，支持启动、停止应用托管的 ComfyUI 并查看实时输出；安装、插件和版本列表增加缓存及手动刷新。

            ## ✍️ 节点工具与素材引用

            - 图片、视频、文本及音频工具栏共用快捷指令栏和管理入口；没有指令时也可新建，打开管理器自动选择当前节点类型，编辑期间保留工具栏布局草稿。
            - 素材引用使用统一标签，支持按节点编号、素材类型与名称搜索，并补充全局资源检索；模型菜单统一厂商分组及选中状态。
            - 视频复刻插件接入连续镜头预览；插件功能仍需安装对应版本与依赖。

            ## 🎨 外观、下载与桌面修复

            - 外观预设支持本地图片及 SVG 背景、主题图片导入导出和多窗口同步，改进大图显示及按钮外观设置。
            - 模型、插件、导演台与应用更新显示实际下载进度；自动更新增加备用下载源，并将每个更新源的检查超时设为 30 秒。
            - 修复音频另存为时的原始格式保留、本地用量账本跟随文件根目录、节点改名光标定位及右键菜单遮挡。
            - 视频调用协议缺失或配置不兼容时显示对应模型与修改入口；修正部分自定义视频模型的音频能力声明，更新内置文本模型目录。
            - macOS 外部编辑器选择适配应用扩展名、应用路径与对话框标题。

            ## ⚠️ 升级与兼容性

            - ComfyUI 模型去重仅处理支持格式且至少 1 MiB 的模型文件；链接替换前应备份并停止服务。硬链接共享文件内容，任一路径原地修改会影响其他引用；软链接依赖保留副本的位置与权限。
            - IndexedDB schema 保持 v22，沿用已有项目、配置与凭据存储。CCC 外层删除会移除全部分组；只删除一组请进入分组管理。
            - 模型能力以厂商文档及实际接口为准，快速适配模板不能证明所有中转型号均支持相同参数；待验证配置仍需真实接口验收，媒体调用可能产生费用。
            - RunningHub、AutoDL、Blender、ComfyUI 和用户插件仍需对应运行环境。视频复刻需要对应插件与依赖，后台全片任务不会在应用重启后自动续跑；提交状态不确定时不会自动重投。可信 Python 插件具有当前用户权限，安装、启用或切换版本需原生确认。
            - AI 应用仍不支持写入其他画布节点或编排模型和文件操作。已有插件必须具有有效源码与 revision 摘要及完整原生私有快照，缺失时需重新安装。
            - Windows 不支持 AVX/AVX2 的旧款 CPU 请使用 Legacy 安装包；Legacy 不包含本地 ONNX 和自动更新，Intel Mac 同样不包含本地语音转文本。
            - 原生窗口、应用内 ComfyUI、MCP 控制桥、本地文件导出与方舟 SQLite 用量账本仅在桌面版可用；浏览器模式的 API Key 仅在当前会话有效，视频导出取决于本机编解码器。
            - macOS 安装包使用临时签名，未经过 Apple 公证；首次打开若被拦截，可在「系统设置 → 隐私与安全性」允许，更多处理方式见[首次打开说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
