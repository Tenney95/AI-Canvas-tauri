name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.28 - 多厂商创作与原结果交付'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.28 补齐万象 MJ 四候选交付、MiniMax 官方视频与语音、多站 GPT Image 2.6，以及 CCC 香蕉参考图与分辨率。本版同时改善 MCP 精确编辑与操作回执、云资产同步、文件保存和视频播放反馈。

            ## 🎨 多厂商图片生成

            - 万象 image 分组新增 Midjourney v6／v6.1／v7／v8.1／v8.2，以及 image-2.6-01 兼容配置；已有 sd-2.5-c1、sd-2.0-c3、minimax-h3 保持在 video 分组。
            - MJ 每次作业提交一次并交付四张候选，节点、提示词窗口、普通对话和 MCP 共用；批量按作业串行，部分保存失败只续存原结果，不重新生成或重复创建已交付内容。
            - APIMart、ToAPIs、Amam、CCC、GRSAI 补入各自已确认的 GPT Image 2.6 型号，参数按对应厂商合同展示，新型号不自动勾选。
            - CCC 香蕉当前候选收敛为 Nano-Banana-pro、Nano-Banana-2、Nano-Banana-2.1，补齐 1K／2K／4K；旧选择单独保留，用户修改的协议不被模板覆盖。
            - 修正 CCC 香蕉原生 Gemini 请求与参考图传输；生图参考预算与文本视觉分开，按已声明的模型数量检查，并明确应用传输大小边界。

            ## 🎬 MiniMax 官方视频与语音

            - 新增 MiniMax 官方连接及独立模型分组，接入 H3 系列与 speech-2.8-hd／turbo；复用已有参数、原任务查询和结果保存入口。
            - 本地图片、视频和音频通过当前官方连接上传，以 mm_file 引用，不再依赖公共图床；文件 ID、Key 与上传缓存不跨连接复用。
            - 保留兼容的用户参数，按型号限制首尾帧与多参考；识别 HTTP 200 中的业务失败，无法确认提交结果时保留任务核对入口，不自动重新生成。

            ## 🔌 MCP 精确编辑与任务回执

            - 支持长提示词续读、分镜字段投影和精确片段修改，节点与分镜写入前复核内容指纹及版本，避免旧读取覆盖新内容。
            - 异构节点补丁先整批准备再提交；改进生成取消、批量进度与媒体交付回执，保留项目和目标身份校验。
            - 持久化操作绑定并提供回执查询，连接中断后优先核对原操作，减少重复执行和付费生成重投。

            ## 📝 本地文本工作流

            - 修复本地 ComfyUI 文本工作流误报缺少厂商 API Key；节点、提示词窗口及 MCP 节点执行复用原有工作流提交、默认输入、素材上传和任务恢复。
            - 从本次提交中唯一的官方 SaveText 读取完整文本，避免把输入展示原文当作增强结果；回填及历史保存成功后才结束交付，继续查询不重新生成。
            - MCP 自定义连接支持明确指定的本机回环 HTTP 地址及端口；公网和局域网 HTTP、IP 缩写及带凭据地址仍不开放。

            ## 📦 资产、文件与画布

            - 改善云资产逐项同步、删除、冲突处理和接收关联，修复分组迁移残留导致的资产读取冲突；云同步仍由用户手动操作。
            - 优化文件复制、分块读取、缩略图缓存、消息分页和项目归档读写，保留取消、路径授权与缺失素材检查。
            - 改善视频首次点击播放时的错误反馈与封面重试；分组展开收起不再占用撤销历史，并修复剧集栏溢出和大纲显示。

            ## ⚠️ 升级与兼容性

            - 数据库沿用 v27，项目包沿用 v3，本版不新增数据迁移。升级前备份重要项目与应用数据，不通过安装旧程序回退数据库。
            - 万象 image-2.6-01 暂按既有 2.5-01 合同兼容，仍待该站实际验收；各站同名型号不代表支持相同参数，实际可用目录以对应分组 Key 为准。
            - MJ 四候选使用完整内置合同；用户改写过的协议予以保留。单结果消费者暂不接受四候选作业；尚未保存的 Base64 结果若没有远端任务 ID，不能保证跨应用重启恢复。
            - 原结果续取依赖已保留的任务或结果信息及服务端文件有效性；链接过期、远端文件删除或历史记录未保存时，不能保证恢复，也不会自动重新付费生成。
            - MiniMax 公网参考地址仍需官方服务器可访问；遇到不可达提示，可改用本地素材走官方直传。国内与国际官方连接分别配置凭据，不跨连接使用私有文件 ID。
            - 升级后请刷新外部 MCP 客户端的工具发现；真实模型调用、云资产往返和跨平台安装升级仍需桌面验收。云同步 HTTP Endpoint 仅用于可信网络。
            - 本地文本工作流目前要求恰好一个官方 SaveText，并返回 text[]；仅 files 输出、多个文本输出或超出应用 2 MiB 文本预算时会明确提示。所需 ComfyUI 插件与本地模型仍由用户准备；本版未确认并修复 Issue #48 所报告的升级丢 Key 原因。
            - Windows 旧款无 AVX／AVX2 CPU 请使用 Legacy 包；Legacy 不包含本地 ONNX 和自动更新。
            - macOS 仅提供 Apple Silicon 包，采用临时签名、未经 Apple 公证；首次打开方式见[安装说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
