name: CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Release source CI plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require a stable release tag on default branch history
        id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci-source-plan.mjs

  frontend-static:
    name: Frontend lint and test types
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.mode == 'full'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and check test types
        run: |
          npm run lint
          npm run test:typecheck

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest shard
        run: npm run test -- --shard=${{ matrix.shard }}

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    needs: [plan, frontend-static, frontend-tests]
    if: ${{ always() }}

    steps:
      - name: Verify the planned front-end checks
        shell: bash
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
          CI_MODE: ${{ needs.plan.outputs.mode }}
          FRONTEND_STATIC_RESULT: ${{ needs.frontend-static.result }}
          FRONTEND_TESTS_RESULT: ${{ needs.frontend-tests.result }}
        run: |
          test "$CI_PLAN_RESULT" = success
          test "$CI_MODE" = full
          test "$FRONTEND_STATIC_RESULT" = success
          test "$FRONTEND_TESTS_RESULT" = success

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check application types and build
        run: npm run build

      - name: Stamp release frontend artifact
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/release-workflow.mjs stamp-frontend

      - name: Keep verified release frontend
        if: needs.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  rust-platform:
    name: Rust check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            cache_key: ci-windows-check
          - platform: macOS
            os: macos-latest
            cache_key: ci-macos-check
          - platform: Linux
            os: ubuntu-latest
            cache_key: ci-linux-check

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Cache Rust check dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.cache_key }}
          save-if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Check Tauri library
        working-directory: src-tauri
        run: cargo check --lib --locked

      - name: Verify Windows media publication and recovery
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib --locked native_project_media::tests::windows_media_

  rust:
    name: Rust check
    runs-on: ubuntu-latest
    needs: [plan, rust-platform]
    if: ${{ always() }}
    steps:
      - name: Verify the planned platform checks
        shell: bash
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
          CI_MODE: ${{ needs.plan.outputs.mode }}
          CI_RUST: ${{ needs.plan.outputs.rust }}
          RUST_PLATFORM_RESULT: ${{ needs.rust-platform.result }}
        run: |
          test "$CI_PLAN_RESULT" = success
          test "$CI_MODE" = full
          test "$CI_RUST" = true
          test "$RUST_PLATFORM_RESULT" = success

  full-source-quality:
    name: Full source quality
    runs-on: ubuntu-latest
    needs: [plan, frontend, rust]
    if: needs.plan.outputs.mode == 'full' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Confirm full source CI
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          CI_RUST: ${{ needs.plan.outputs.rust }}
        run: test "$FRONTEND_RESULT" = success && test "$RUST_RESULT" = success && test "$CI_RUST" = true
