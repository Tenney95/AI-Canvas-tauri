[[permission]]
identifier = "allow-project-asset-storage"
description = "Allows main-window project-scoped storage configuration, checks, manual sync and confirmed cloud-only cleanup."
commands.allow = [
  "project_asset_storage_snapshot",
  "project_asset_storage_save_connection",
  "project_asset_storage_remove_connection",
  "project_asset_storage_bind_project",
  "project_asset_storage_probe_project",
  "project_asset_storage_unbind_project",
  "project_asset_storage_cancel",
  "project_asset_storage_preview_cleanup",
  "project_asset_storage_apply_cleanup",
  "project_asset_storage_preview_asset_delete",
  "project_asset_storage_apply_asset_delete",
  "project_asset_storage_list_heads",
  "project_asset_storage_prepare_publish",
  "project_asset_storage_publish_revision",
  "project_asset_storage_download_revision",
  "project_asset_storage_recover_operation",
  "project_asset_storage_acknowledge_apply",
]

[[permission]]
identifier = "deny-project-asset-storage"
description = "Denies all project-scoped object storage commands."
commands.deny = [
  "project_asset_storage_preview_asset_delete",
  "project_asset_storage_apply_asset_delete",
  "project_asset_storage_preview_cleanup",
  "project_asset_storage_apply_cleanup",
  "project_asset_storage_list_heads",
  "project_asset_storage_prepare_publish",
  "project_asset_storage_publish_revision",
  "project_asset_storage_download_revision",
  "project_asset_storage_recover_operation",
  "project_asset_storage_acknowledge_apply",
  "project_asset_storage_snapshot",
  "project_asset_storage_save_connection",
  "project_asset_storage_remove_connection",
  "project_asset_storage_bind_project",
  "project_asset_storage_probe_project",
  "project_asset_storage_unbind_project",
  "project_asset_storage_cancel",
]
